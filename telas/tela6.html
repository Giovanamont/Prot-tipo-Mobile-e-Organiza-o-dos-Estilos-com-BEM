<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HABIT</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/card.css">
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/metric.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/table.css">
    <link rel="stylesheet" href="../css/image.css">
</head>
<body>
    <header class="navigation">
        <div class="navigation_list">
            <a class="navigation__logo"><strong>HABIT</strong></a>
            <a class="navigation__link">Inicio</a>
            <a class="navigation__link">Páginas</a>
            <a class="navigation__link">Destaques</a>
            <a class="navigation__link">Assinar</a>
            <a class="navigation__link">Admin</a>
        </div>
        <div class="navigation__actions">
            <input type="text" placeholder="Buscar..." class="navigation__search-input">
            <button class="button button--outline">Buscar</button>
            <button class="button button--outline">Entrar</button>
        </div>
    </header>

    <main>
        <div class="admin-grid">  
            <!-- Menu lateral -->
            <aside class="menu">
                <h2 class="menu__title">Menu</h2>
                <ul class="menu__list">
                    <li class="menu__item" >Categorias</li>
                    <li class="menu__item">Criar post</li>
                    <li class="menu__item">Escolhas do Editor</li>
                    <li class="menu__item">Usuários</li>
                    <li class="menu__item">Fila de revisão</li>
                    <li class="menu__item">Fila de comentários</li>
                </ul>
            </aside>

            <!-- Div para o conteudo da tela -->
            <div class="admin-grid__content">
                <div class="metrics-grid">
                    <div class="metric-card">
                        <p class="metric-card__label">Posts</p>
                        <p class="metric-card__value">128</p>
                    </div>
                    <div class="metric-card">
                        <p class="metric-card__label">Visualizações</p>
                        <p class="metric-card__value">54k</p>
                    </div>
                    <div class="metric-card">
                        <p class="metric-card__label">Inscritos</p>
                        <p class="metric-card__value">12k</p>
                    </div>
                    <div class="metric-card">
                        <p class="metric-card__label">Pendências</p>
                        <p class="metric-card__value">7</p>
                    </div>
                </div>
                
                <section class="table-panel">
                    <h2 class="table-panel__title">Criar Post</h2>
                         
                    
                    <button type="submit" class="button button--outline">Salvar rascunho</button>
                    <button type="submit" class="button button--outline">Enviar para revisão</button>
                    <button type="submit" class="button button--primary">Publicar (admin)</button>
                </section>
            </div>

        </div>
    </main>

    <footer class="footer">
        <div class="footer__container-tags">
            <span class="footer__tag">Insta</span>
            <span class="footer__tag">Work</span>
            <span class="footer__tag">Bags</span>
            <span class="footer__tag">Lamp</span>
            <span class="footer__tag">Books</span>
        </div>
    </footer>
</body>
</html>
