<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HABIT</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/card.css">
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/metric.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/table.css">
    <link rel="stylesheet" href="../css/image.css">
    <link rel="stylesheet" href="../css/form.css">
</head>
<body>
    <header class="navigation">
        <div class="navigation_list">
            <a class="navigation__logo"><strong>HABIT</strong></a>
            <a class="navigation__link">Inicio</a>
            <a class="navigation__link">Páginas</a>
            <a class="navigation__link">Destaques</a>
            <a class="navigation__link">Assinar</a>
            <a class="navigation__link">Admin</a>
        </div>
        <div class="navigation__actions">
            <input type="text" placeholder="Buscar..." class="navigation__search-input">
            <button class="button button--outline">Buscar</button>
            <button class="button button--outline">Entrar</button>
        </div>
    </header>

    <div class="form-card">
    <h1 class="form-card__title">Criar Conta</h1>

    <form class="form form--newsletter">
      <div class="form__group">
        <input type="text" id="text" class="form__input" placeholder="Nome completo">
      </div>
        <div class="form__group">
        <input type="text" id="text" class="form__input" placeholder="E-mail">
      </div>
      <div class="form__group">
        <input type="password" id="password" class="form__input" placeholder="Senha">
      </div>
      <div class="form__group">
        <input type="password" id="password" class="form__input" placeholder="Confirmar senha">
      </div>
    
      <div class="form__checkbox-group">
        <input type="checkbox" id="concordo" class="form__checkbox">
        <label class="form__checkbox-label" for="concordo">
          Concordo com os termos e a política de privacidade.
        </label>
      </div>

      <button type="submit" class="button button--primary">Cadastrar</button>
      
    </form>
  </div>

    <footer class="footer">
        <div class="footer__container-tags">
            <span class="footer__tag">Insta</span>
            <span class="footer__tag">Work</span>
            <span class="footer__tag">Bags</span>
            <span class="footer__tag">Lamp</span>
            <span class="footer__tag">Books</span>
        </div>
    </footer>
</body>
</html>
