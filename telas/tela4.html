<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assine a Newsletter</title>
  <link rel="stylesheet" href="../css/navigation.css">
  <link rel="stylesheet" href="../css/button.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/form.css">
</head>
<body>

  <nav class="navigation">
    <div class="navigation__logo">HABIT</div>

    <ul class="navigation__list">
      <li class="navigation__item"><a href="#" class="navigation__link">Início</a></li>
      <li class="navigation__item"><a href="#" class="navigation__link">Páginas</a></li>
      <li class="navigation__item"><a href="#" class="navigation__link">Destaques</a></li>
      <li class="navigation__item"><a href="#" class="navigation__link">Assinar</a></li>
      <li class="navigation__item"><a href="#" class="navigation__link">Admin</a></li>
    </ul>

    <div class="navigation__actions">
      <input type="text" class="navigation__search-input" placeholder="Buscar...">
      <button class="button button--secondary">Buscar</button>
      <button class="button button--primary">Entrar</button>
    </div>
  </nav>

  <div class="form-card">
    <h1 class="form-card__title">Assine a newsletter</h1>

    <form class="form form--newsletter">
      <div class="form__group">
        <label class="form__label" for="text">E-mail</label>
        <input type="text" id="text" class="form__input" placeholder="seu@email.com">
      </div>

      <div class="form__checkbox-group">
        <input type="checkbox" id="concordo" class="form__checkbox">
        <label class="form__checkbox-label" for="concordo">
          Concordo em receber comunicações e li a política de privacidade.
        </label>
      </div>

      <button type="submit" class="button button--primary">Assinar</button>
    </form>
  </div>

  <footer class="site-footer">
    <ul class="site-footer__links">
      <li><a href="#" class="site-footer__link">Instagram</a></li>
      <li><a href="#" class="site-footer__link">Work</a></li>
      <li><a href="#" class="site-footer__link">Bags</a></li>
      <li><a href="#" class="site-footer__link">Lamp</a></li>
      <li><a href="#" class="site-footer__link">Books</a></li>
    </ul>
    <p class="site-footer__copyright">© 2025 Meu Site • Meu site</p>
  </footer>

</body>
</html>
